<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وشپارس</title>
    <link rel="stylesheet" href="veshpars.css">
</head>
<body class="veshpars-body">

    <script>
        for (let i = 0; i < 30; i++) {
            let bubble = document.createElement('div');
            bubble.className = 'bubble';
            let size = Math.random() * 30 + 10;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.background = Math.random() > 0.5 ? '#6a11cb' : '#2575fc';
            bubble.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(bubble);
            bubble.style.animationDuration = (Math.random() * 13 + 12) + 's';

        }
    </script>
    <div class="ertegha-go">
        <h2 class="h2-ertegha">ارتفاع سایت</h2>
        <h6 class="h6-ertegha">شما میتوانید با وشپارس سایت های خود را ارتفاع دهید</h6>
        <button class="btn-ertegha">مشاهده</button>
    </div>
</body>
</html>
